name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # Faellt eine Uebersetzung aus, greift zur Laufzeit stillschweigend der
      # deutsche Fallback. Hier bricht der Build stattdessen ab.
      - run: npm run check:i18n
      - run: npm run build
        env:
          # Eigene Instanz unter novogenia-ag.github.io/10x-health-academy/
          VITE_BASE_PATH: /10x-health-academy/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages liefert bei unbekannten Pfaden seine eigene 404-Seite.
      # Dieselbe index.html als 404.html laedt stattdessen die App.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # ACHTUNG bei Deploy-Timeouts ("Timeout reached, aborting!"):
        # Der `timeout`-Parameter hilft NICHT — die Action deckelt ihn hart auf
        # 600000 ms (10 Min) und meldet dann nur "timeout set to the maximum".
        # Ursache ist die Artefaktgroesse: ~182 MB, davon ~162 MB in sieben
        # Dateien unter public/course-materials (u.a. Schulungsfolien_
        # Pharmacogenetics.pptx 47 MB, Demo_Performance_Sensor.pdf 36 MB).
        # Dauerhafte Loesung: diese Dateien wie die acht bereits ausgelagerten
        # ins GitHub-Release "course-materials" (oder Supabase Storage)
        # verschieben und in data.js auf die absolute URL umstellen.
        uses: actions/deploy-pages@v4
