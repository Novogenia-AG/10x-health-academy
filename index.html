<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X Health Academy</title>
    <meta name="description" content="The 10X Health genetics training platform. Learn genetic consultation at your own pace, complete modules with tests, and earn your 10X Health Genetics Coach certificate." />
    <meta name="theme-color" content="#000000" />

    <!-- ===== SECURITY HEADERS (meta fallback for GitHub Pages static hosting) ===== -->
    <!-- Content-Security-Policy: allowlist every source the app needs.
         connect-src nennt bewusst den KONKRETEN Supabase-Host statt *.supabase.co:
         die Wildcard haette jedes fremde Supabase-Projekt als Ziel erlaubt und damit
         den Zweck der Direktive (Exfiltration begrenzen) aufgehoben.
         script-src ohne blob: — blob:-Skripte sind ein klassischer Umweg um die CSP;
         der PDF-Worker braucht nur worker-src blob:, nicht script-src.
         *.githubusercontent.com deckt objects/raw/release-assets zugleich ab; der Host
         fuer Release-Anhaenge hat sich bereits einmal umbenannt, wodurch die PDF-
         Vorschau der ausgelagerten Dokumente still blockiert wurde. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'none';
      script-src  'self';
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    'self' https://fonts.gstatic.com;
      img-src     'self' data: blob: https://img.youtube.com https://i.ytimg.com;
      connect-src 'self'
                  https://whjxtrrztfzhjqtsyqqf.supabase.co
                  wss://whjxtrrztfzhjqtsyqqf.supabase.co
                  https://fonts.googleapis.com
                  https://fonts.gstatic.com
                  https://github.com
                  https://*.githubusercontent.com;
      frame-src   https://www.youtube.com https://www.youtube-nocookie.com;
      worker-src  'self' blob:;
      object-src  'none';
      base-uri    'self';
      form-action 'self';
    " />
    <!-- Clickjacking-Schutz: X-Frame-Options UND CSP frame-ancestors sind als
         <meta> wirkungslos — beides verlangt einen echten HTTP-Header, den
         GitHub Pages nicht setzen kann (im Browser verifiziert: "may only be
         set via an HTTP header" bzw. "is ignored when delivered via a <meta>").
         Solange die Seite auf GitHub Pages liegt, ist das Frame-Busting unten
         der einzige wirksame Schutz. Bei einem Wechsel auf Cloudflare Pages /
         Netlify stattdessen echte Header setzen und dies hier entfernen. -->
    <!-- Das Frame-Busting steht in src/main.jsx, NICHT hier als Inline-Skript:
         die CSP erlaubt nur `script-src 'self' blob:`, ein Inline-Skript wuerde
         blockiert (im Browser verifiziert). -->
    <!-- Limit referrer leakage (als <meta name> gültig) -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ===== FAVICON (10X Health) ===== -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

    <!-- ===== FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 10X Health: Oswald (Überschriften) + Inter (Text/Buttons). Montserrat bleibt nur
         für die Zertifikatsansicht, die das PDF mit eingebetteter Montserrat nachbildet.
         Ursprünglich: Montserrat only — all 7 weights are used by the design system.
         (Caveat was requested here but never referenced in any stylesheet;
         removed so it no longer costs a font download on every visit.) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Warm up the Supabase connection so the first auth/session call is faster -->
    <link rel="preconnect" href="https://whjxtrrztfzhjqtsyqqf.supabase.co" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
